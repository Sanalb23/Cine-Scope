name: cine_scope
description: "CineScope: Your ultimate movie discovery and tracking app."
publish_to: 'none'
version: 1.0.1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flex_color_scheme: ^8.4.0
  google_fonts: ^8.0.2
  http: ^1.6.0
  flutter_riverpod: ^3.3.1
  overflow_view: ^0.5.0
  shared_preferences: ^2.5.5
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  json_annotation: ^4.9.0
  easy_localization: ^3.0.8
  url_launcher: ^6.3.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  permission_handler: ^12.0.1
  popover: ^0.4.0
  flutter_launcher_icons: ^0.14.4
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  json_serializable: ^6.10.0
  


flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/logo/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon/icon.png"
  
  adaptive_icon_background: "assets/images/icon/background.png" 
  adaptive_icon_foreground: "assets/images/icon/icon.png"

  web:
    generate: true
    image_path: "assets/images/icon/favicon.png" 
    background_color: "#365a8e" 
    theme_color: "#FFFFFF"